[tool.poetry]
name = "erp-auth-service"
version = "0.1.0"
description = "ERP Auth microservice (FastAPI + PostgreSQL + MQTT)"
authors = ["ERP Team"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "^0.115.0"
uvicorn = {version = "^0.30.0", extras = ["standard"]}
SQLAlchemy = "^2.0.30"
asyncpg = "^0.29.0"
passlib = {version = "^1.7.4", extras = ["bcrypt"]}
jinja2 = "^3.1.4"
pydantic-settings = "^2.4.0"
paho-mqtt = "^2.1.0"
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
ruff = "^0.5.0"

