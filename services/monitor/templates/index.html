<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERP Login Monitor</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Login Olayları</h1>
      <div id="status" class="status">Bağlanıyor...</div>
      <ul id="events" class="events"></ul>
    </div>
    <script>
      const statusEl = document.getElementById('status');
      const listEl = document.getElementById('events');
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}/ws`);
      ws.onopen = () => { statusEl.textContent = 'Bağlandı'; };
      ws.onclose = () => { statusEl.textContent = 'Bağlantı kapandı'; };
      ws.onerror = () => { statusEl.textContent = 'Hata'; };
      ws.onmessage = (ev) => {
        try {
          const data = JSON.parse(ev.data);
          const li = document.createElement('li');
          const payload = data.payload || {};
          const when = new Date().toLocaleTimeString();
          const ok = payload.success ? '✔️' : '❌';
          li.textContent = `${when} ${ok} ${payload.username || ''} ${payload.user_id ? '(id:' + payload.user_id + ')' : ''}`;
          li.className = payload.success ? 'ok' : 'err';
          listEl.prepend(li);
        } catch (e) {}
      };
    </script>
  </body>
  </html>
